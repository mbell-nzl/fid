version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - paralleltest
  settings:
    paralleltest:
      # Top-level tests must call t.Parallel() unless they touch process-global
      # state (t.Setenv, package hooks); annotate those with a nolint reason.
      # Subtests stay the author's choice: parallelize long-running matrices.
      ignore-missing-subtests: true

formatters:
  enable:
    - gofmt
    - goimports
