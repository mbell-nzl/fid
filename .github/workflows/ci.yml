name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Verify shard selection and coverage reconciliation
        run: python3 -m unittest discover -s project-docs/tools -p test_ci_tests.py -v

      - name: Build
        run: make build

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Migration baseline assertions compare against pinned historical commits.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Tests (race and coverage, exhaustive shard)
        run: python3 project-docs/tools/ci_tests.py run --count 4 --index ${{ matrix.shard }} --out "$RUNNER_TEMP/shard-${{ matrix.shard }}"

      - name: Retain coverage and execution evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  # Preserve the required "quality" check, and fail it if any dependency fails
  # or is cancelled. A skipped merge job must never look like successful CI.
  quality:
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks and every test shard
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: test "$CHECKS_RESULT" = success && test "$TESTS_RESULT" = success

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download shard evidence
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/ci-results

      - name: Verify complete execution and combine coverage
        run: python3 project-docs/tools/ci_tests.py merge --count 4 --root "$RUNNER_TEMP/ci-results" --out coverage.out

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Retain combined coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7
