# Store concrete held-out scenarios outside normal implementation agent context.
# This file is a structure template only and may live in this starter kit.

id: SC-000
name: <scenario name>
version: 1
status: draft # draft | active | retired
owner: <human owner>

persona: |
  <Who is using the product? What do they know, need, and fear?>

goal: |
  <What should the persona accomplish in one realistic session?>

starting_state:
  - <initial data/environment/tool state>

allowed_tools:
  - <terminal/browser/API/client/manual only/etc.>

trajectory_prompts:
  - <Question the evaluator or human should answer after running the journey.>

satisfaction_criteria:
  critical:
    - <Must pass; release blocker if false.>
  important:
    - <Important but not always release blocking.>
  nice_to_have:
    - <Positive signal.>

forbidden_behaviors:
  - <Behavior that should fail the scenario immediately.>

evaluation:
  mode_a:
    evaluator_model_or_tool: <TBD>
    trace_artifact: <path or N/A>
  mode_b:
    human_runner: <name>
    notes_artifact: <path or N/A>

contamination_log:
  - date: <YYYY-MM-DD>
    event: <who/what read it; retire if implementation agent saw it>
